x-pi-appliance:
  name: FileBrowser Quantum
  description: Ranger, envoyer, télécharger, prévisualiser et partager ses fichiers depuis le navigateur, plus simple et plus léger que Nextcloud.
  icon: M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v6M9 13l3-3l3 3
  category: Fichiers
  tags: [fichiers]
  license: Apache-2.0
  subdomain: fichiers
  service: filebrowser
  port: 80
  memory_mb: 128
  disk_mb: 1024
  login: application
  access: users
  parameters:
    - name: FILEBROWSER_ADMIN_PASSWORD
      label: Mot de passe de l'administrateur de FileBrowser Quantum (identifiant admin)
      generate: true

services:
  # Branche maintenue de File Browser (gtsteffaniak/filebrowser) : le projet
  # d'origine est archivé depuis le 2026-09-01, sans correctifs de sécurité.
  # Image « slim » : sans les aperçus vidéo et bureautique, plus légère pour
  # le Pi. Statistiques d'usage envoyées au projet : coupées par défaut, on
  # ne les active pas.
  filebrowser:
    image: gtstef/filebrowser:2.0.2-stable-slim
    restart: unless-stopped
    environment:
      FILEBROWSER_CONFIG: /run/pi-appliance/config.yaml
      # Compte « admin » créé au premier démarrage avec ce mot de passe tiré
      # au hasard, à la place d'un mot de passe écrit dans le journal.
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD}
      # Chemin de base de l'application (baseURL ci-dessous), répété ici :
      # Docker Compose ne recrée pas le conteneur quand seul le contenu d'une
      # configs change (TODO-2.70), la mise à jour du service ne le prendrait
      # pas. À changer avec la configuration ci-dessous.
      PI_CHEMIN: /${PI_INSTANCE}/
    # Les fichiers sont rangés dans le volume de l'application (sous-dossier
    # « fichiers », créé au démarrage), à côté de sa base : un volume neuf
    # monté sur /srv appartiendrait à root, et l'application, qui ne tourne
    # pas en root, ne pourrait rien y écrire.
    entrypoint: ["sh", "-c", "mkdir -p /home/filebrowser/data/fichiers && exec ./filebrowser"]
    # Santé lue sous le chemin de base (celle de l'image lit /health, que
    # l'application renvoie maintenant vers /<nom>/).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/${PI_INSTANCE}/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    configs:
      - source: config
        target: /run/pi-appliance/config.yaml
    volumes:
      - data:/home/filebrowser/data

# Interface en français, pas d'inscription libre : l'administrateur crée les
# comptes dans FileBrowser Quantum.
# Chemin de base /<nom du service>/ (spécification 8.2, TODO-3.17) : la même
# adresse sert à la maison (https://<service>-<nom du Pi>.local/, que
# l'application renvoie vers /<nom>/) et depuis internet
# (https://<adresse internet du Pi>/<nom>/, sans retrait du chemin par
# Traefik). trustProxyHeaders : adresse du visiteur et liens de partage
# d'après les en-têtes posés par Traefik, seul à joindre le conteneur.
configs:
  config:
    content: |
      http:
        port: 80
        baseURL: /${PI_INSTANCE}/
        trustProxyHeaders: true
      server:
        sources:
          - path: /home/filebrowser/data/fichiers
            name: Fichiers
      auth:
        adminUsername: admin
        methods:
          password:
            enabled: true
            minLength: 10
            signup: false
      userDefaults:
        ui:
          locale: fr

volumes:
  data:
