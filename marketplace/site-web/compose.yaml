x-pi-appliance:
  name: Site web
  description: Votre site internet, hébergé chez vous. Pages simples ou en PHP.
  icon: M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9
  category: Site web
  license: Apache-2.0 et PHP-3.01
  subdomain: www
  service: web
  port: 80
  memory_mb: 128
  disk_mb: 1024
  login: application
  access: public
  parameters:
    - name: FTP_PASSWORD
      label: Mot de passe FTP
      generate: true
    - name: FTP_PORT
      label: Port FTP
      default: "2121"

services:
  web:
    image: php:8.4-apache
    restart: unless-stopped
    # Tant que le dossier du site est vide, une page « Site en construction »
    # s'affiche à la place d'une erreur.
    command:
      - sh
      - -c
      - |
        if [ -z "$$(ls -A /var/www/html)" ]; then
          printf '%s\n' '<!doctype html>' '<html lang="fr"><meta charset="utf-8"><title>Site en construction</title>' '<body style="font-family:sans-serif;text-align:center;margin-top:20vh">' '<h1>Site en construction</h1><p>Ce site est hébergé sur un pi-appliance.</p></body></html>' > /var/www/html/index.html
        fi
        exec apache2-foreground
    volumes:
      - site:/var/www/html

  ftp:
    image: stilliard/pure-ftpd:hardened-1.0.52
    restart: unless-stopped
    environment:
      FTP_USER_NAME: pi
      FTP_USER_PASS: ${FTP_PASSWORD}
      FTP_USER_HOME: /var/www/html
      ADDED_FLAGS: -d -d
    ports:
      - "${FTP_PORT}:21"
    volumes:
      - site:/var/www/html

volumes:
  site:
