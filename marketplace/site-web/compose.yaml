x-pi-appliance:
  name: Site web
  description: Votre site internet, hébergé chez vous. Pages simples ou en PHP.
  icon: M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9
  category: Site web
  tags: [site-web]
  license: Apache-2.0 et PHP-3.01
  subdomain: www
  service: web
  port: 80
  memory_mb: 128
  disk_mb: 1024
  login: application
  access: public
  # Dossier du site, déposé par Nextcloud.
  files:
    - service: web
      path: /var/www/html

services:
  web:
    image: php:8.4-apache
    restart: unless-stopped
    environment:
      # Dossier Nextcloud du site, nommé dans la page d'attente.
      SITE_FOLDER: Site ${PI_INSTANCE}
    # Tant que le dossier du site est vide, une page « Site en construction »
    # s'affiche à la place d'une erreur.
    command:
      - sh
      - -c
      - |
        if [ -z "$$(ls -A /var/www/html)" ]; then
          # Page d'attente : explique comment publier la première page
          # (dossier Nextcloud, site minimal, que faire si rien ne change).
          cat > /var/www/html/index.html <<EOF
        <!doctype html>
        <html lang="fr">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Site en construction</title>
        <style>
        body { margin: 0; background: #FFF5F7; color: #33141F; font: 16px/1.55 system-ui, sans-serif; }
        main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
        h1 { margin: 0 0 .3rem; font-size: 2rem; text-align: center; }
        .lead { margin: 0 0 2rem; text-align: center; }
        section { background: #fff; border-radius: 12px; box-shadow: 0 2px 0 #F0D3DC; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
        h2 { margin-top: 0; font-size: 1.25rem; color: #A8174E; }
        h3 { font-size: 1.05rem; margin: 1.4rem 0 .4rem; }
        li { margin-bottom: .6rem; }
        code { background: #FCE4EC; border-radius: 4px; padding: 0 .25rem; }
        pre { background: #33141F; color: #FFF5F7; border-radius: 8px; padding: .7rem .9rem; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        .name { margin: .8rem 0 .2rem; font-weight: 600; }
        </style>
        </head>
        <body>
        <main>
        <h1>Site en construction</h1>
        <p class="lead">Ce site sera bientôt en ligne. Il est hébergé sur un pi-appliance.</p>

        <section>
        <h2>Vous gérez ce site ? Publiez la première page en 4 étapes</h2>
        <ol>
        <li><strong>Ouvrez Nextcloud</strong> sur votre Pi, avec un compte administrateur de Nextcloud. Pas encore de Nextcloud ? Installez-le depuis la marketplace de la console : le dossier du site y apparaît tout seul après quelques minutes.</li>
        <li><strong>Ouvrez le dossier « $$SITE_FOLDER »</strong>. C'est le dossier de ce site : ce que vous y mettez est publié ici.</li>
        <li><strong>Remplacez le fichier <code>index.html</code></strong> du dossier, qui est cette page, par la page d'accueil de votre site, puis ajoutez vos autres pages, images et styles. Les pages en PHP (<code>.php</code>) marchent aussi.</li>
        <li><strong>Rechargez cette page</strong> : votre site s'affiche aussitôt. Pour le changer ensuite, modifiez les fichiers dans le même dossier.</li>
        </ol>
        </section>

        <section>
        <h2>Pas encore de site ? Une première page en un fichier</h2>
        <p>Dans le dossier « $$SITE_FOLDER » de Nextcloud, le bouton « + Nouveau » crée un dossier ou un fichier texte. Ouvrez le fichier <code>index.html</code> qui y est déjà (c'est cette page) et remplacez tout son texte par celui-ci, ou supprimez-le et recréez-le. Créez ce fichier, avec exactement ce nom :</p>
        <p class="name">1. <code>index.html</code> (la page d'accueil, à la place de celle qui y est)</p>
        <pre><code>&lt;!doctype html&gt;
        &lt;html lang="fr"&gt;
        &lt;head&gt;&lt;meta charset="utf-8"&gt;&lt;title&gt;Mon site&lt;/title&gt;&lt;/head&gt;
        &lt;body&gt;&lt;h1&gt;Bienvenue&lt;/h1&gt;&lt;p&gt;Ma première page, publiée depuis mon Raspberry Pi.&lt;/p&gt;&lt;/body&gt;
        &lt;/html&gt;</code></pre>
        <p>Rechargez cette page : « Bienvenue » s'affiche à la place de ce texte.</p>
        </section>

        <section>
        <h2>Cette page ne change pas ?</h2>
        <ul>
        <li>La page d'accueil doit s'appeler exactement <code>index.html</code> (ou <code>index.php</code>), en minuscules, directement dans le dossier « $$SITE_FOLDER » et pas dans un sous-dossier.</li>
        <li>Si votre navigateur montre encore l'ancienne page, rechargez-la en forçant (touche Maj enfoncée en cliquant sur « Recharger »).</li>
        </ul>
        </section>
        </main>
        </body>
        </html>
        EOF
          # Modifiable depuis Nextcloud (www-data, 33, comme Apache).
          chown www-data:www-data /var/www/html/index.html
        fi
        exec apache2-foreground
    volumes:
      - site:/var/www/html

volumes:
  site:
