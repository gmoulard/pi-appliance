x-pi-appliance:
  name: Site Next.js
  description: "Un site React construit avec Next.js, en export statique (output: 'export'). Déposez le projet : il est reconstruit tout seul."
  icon: M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM9 16V8l6 8V8
  category: Site web
  license: MIT (Next.js, Node.js) et BSD-2-Clause (nginx)
  subdomain: next
  service: web
  port: 80
  memory_mb: 1536
  disk_mb: 2048
  login: application
  access: public
  # Fichiers source déposés par Nextcloud.
  files:
    - service: builder
      path: /src

services:
  web:
    image: nginx:1.30-alpine
    restart: unless-stopped
    # Sert le dernier site construit sans erreur (volume public, dossier site).
    command:
      - sh
      - -c
      - |
        printf '%s\n' 'server {' '  listen 80;' '  absolute_redirect off;' '  root /srv/site;' '  index index.html;' '  location / { try_files $$uri $$uri/ $$uri.html =404; }' '  error_page 404 /404.html;' '}' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - public:/srv:ro

  # Construit le site à chaque changement des fichiers source (vérifié toutes
  # les 10 secondes). En cas d'échec, le site précédent reste en ligne ;
  # l'état et le journal sont écrits dans le dossier des fichiers source
  # (.pi-appliance-build, .pi-appliance-build.log).
  builder:
    image: node:24-alpine
    restart: unless-stopped
    environment:
      SITE_URL: https://${PI_HOST}/
      SITE_GENERATOR: Next.js
      NEXT_TELEMETRY_DISABLED: "1"
    entrypoint:
      - sh
      - -c
      - |
        build() {
          npm install --no-audit --no-fund && npx next build || return 1
          if [ ! -d out ]; then
            echo "Next.js n'a pas produit de site statique : ajoutez output: 'export' dans next.config."
            return 1
          fi
          cp -a out /public/next
        }
        signature() {
          find /src \( -name node_modules -o -name .git -o -name '.pi-appliance-build*' \) -prune -o -type f -exec stat -c '%n %s %Y' {} + 2>/dev/null | md5sum
        }
        status() {
          printf '%s\n%s\n' "$$1" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /src/.pi-appliance-build
        }
        publish() {
          rm -rf /public/old
          if [ -d /public/site ]; then mv /public/site /public/old; fi
          mv /public/next /public/site
          rm -rf /public/old
        }
        placeholder() {
          rm -rf /public/next
          mkdir -p /public/next
          printf '%s\n' '<!doctype html>' '<html lang="fr"><meta charset="utf-8"><title>Site en construction</title>' '<body style="font-family:sans-serif;text-align:center;margin-top:20vh">' "<h1>Site en construction</h1><p>Déposez les fichiers source de votre site $$SITE_GENERATOR.</p></body></html>" > /public/next/index.html
          publish
        }
        mkdir -p /src /work /public /cache
        last=
        while :; do
          current=$$(signature)
          if [ "$$current" != "$$last" ]; then
            last=$$current
            if [ -z "$$(find /src -mindepth 1 -maxdepth 1 ! -name '.pi-appliance-build*' | head -n 1)" ]; then
              rm -f /src/.pi-appliance-build /src/.pi-appliance-build.log
              placeholder
            else
              status building
              find /work -mindepth 1 -maxdepth 1 ! -name node_modules -exec rm -rf {} +
              cp -a /src/. /work/
              rm -f /work/.pi-appliance-build /work/.pi-appliance-build.log
              rm -rf /public/next
              if ! (cd /work && build) > /src/.pi-appliance-build.log 2>&1; then
                echo "La construction a échoué : le site précédent reste en ligne." >> /src/.pi-appliance-build.log
                rm -rf /public/next
                [ -d /public/site ] || placeholder
                status failed
              elif [ ! -f /public/next/index.html ]; then
                echo "Aucune page d'accueil (index.html) produite : le site précédent reste en ligne." >> /src/.pi-appliance-build.log
                rm -rf /public/next
                [ -d /public/site ] || placeholder
                status failed
              else
                publish
                status ok
              fi
            fi
          fi
          sleep 10
        done
    volumes:
      - public:/public
      - work:/work
      - cache:/cache

volumes:
  public:
  work:
  cache:
