x-pi-appliance:
  name: Site Hugo
  description: "Un site rapide écrit en Markdown avec Hugo. Déposez les fichiers source du site : il est reconstruit tout seul."
  icon: M12 2l9 5v10l-9 5l-9-5V7zM9 8v8M15 8v8M9 12h6
  category: Site web
  tags: [site-web]
  license: Apache-2.0 (Hugo) et BSD-2-Clause (nginx)
  subdomain: hugo
  service: web
  port: 80
  memory_mb: 256
  disk_mb: 1024
  login: application
  access: public
  # Fichiers source déposés par Nextcloud.
  files:
    - service: builder
      path: /src

services:
  web:
    image: nginx:1.30-alpine
    restart: unless-stopped
    # Sert le dernier site construit sans erreur (volume public, dossier site) ;
    # sous l'adresse internet du Pi (https://<adresse>/<nom>/, Traefik pose
    # X-Forwarded-Prefix), la copie construite pour ce chemin (site/.pi-path).
    command:
      - sh
      - -c
      - |
        printf '%s\n' 'server {' '  listen 80;' '  absolute_redirect off;' '  set $$site /srv/site;' '  if ($$http_x_forwarded_prefix) { set $$site /srv/site/.pi-path; }' '  root $$site;' '  index index.html;' '  location / { try_files $$uri $$uri/ $$uri.html =404; }' '  error_page 404 /404.html;' '}' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - public:/srv:ro

  # Construit le site à chaque changement des fichiers source (vérifié toutes
  # les 10 secondes). En cas d'échec, le site précédent reste en ligne ;
  # l'état et le journal sont écrits dans le dossier des fichiers source
  # (.pi-appliance-build, .pi-appliance-build.log).
  builder:
    image: hugomods/hugo:std-0.165.0
    restart: unless-stopped
    environment:
      SITE_URL: https://${PI_HOST}/
      # Chemin du service sous l'adresse internet du Pi.
      SITE_PATH: /${PI_INSTANCE}/
      SITE_GENERATOR: Hugo
      # Dossier Nextcloud du site, nommé dans la page d'attente.
      SITE_FOLDER: Site ${PI_INSTANCE}
    entrypoint:
      - sh
      - -c
      - |
        build() {
          hugo --source /work --destination /public/next --baseURL "$$SITE_URL" --minify &&
            hugo --source /work --destination /public/next/.pi-path --baseURL "$$SITE_PATH" --minify
        }
        signature() {
          find /src \( -name node_modules -o -name .git -o -name '.pi-appliance-build*' \) -prune -o -type f -exec stat -c '%n %s %Y' {} + 2>/dev/null | md5sum
        }
        status() {
          printf '%s\n%s\n' "$$1" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /src/.pi-appliance-build
        }
        publish() {
          rm -rf /public/old
          if [ -d /public/site ]; then mv /public/site /public/old; fi
          mv /public/next /public/site
          rm -rf /public/old
        }
        placeholder() {
          rm -rf /public/next
          mkdir -p /public/next
          # Page d'attente : explique comment publier la première page
          # (dossier Nextcloud, site minimal, que faire si rien ne change).
          cat > /public/next/index.html <<EOF
        <!doctype html>
        <html lang="fr">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Site en construction</title>
        <style>
        body { margin: 0; background: #FFF5F7; color: #33141F; font: 16px/1.55 system-ui, sans-serif; }
        main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
        h1 { margin: 0 0 .3rem; font-size: 2rem; text-align: center; }
        .lead { margin: 0 0 2rem; text-align: center; }
        section { background: #fff; border-radius: 12px; box-shadow: 0 2px 0 #F0D3DC; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
        h2 { margin-top: 0; font-size: 1.25rem; color: #A8174E; }
        h3 { font-size: 1.05rem; margin: 1.4rem 0 .4rem; }
        li { margin-bottom: .6rem; }
        code { background: #FCE4EC; border-radius: 4px; padding: 0 .25rem; }
        pre { background: #33141F; color: #FFF5F7; border-radius: 8px; padding: .7rem .9rem; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        .name { margin: .8rem 0 .2rem; font-weight: 600; }
        </style>
        </head>
        <body>
        <main>
        <h1>Site en construction</h1>
        <p class="lead">Ce site sera bientôt en ligne. Il est hébergé sur un pi-appliance.</p>

        <section>
        <h2>Vous gérez ce site ? Publiez la première page en 4 étapes</h2>
        <ol>
        <li><strong>Ouvrez Nextcloud</strong> sur votre Pi, avec un compte administrateur de Nextcloud. Pas encore de Nextcloud ? Installez-le depuis la marketplace de la console : le dossier du site y apparaît tout seul après quelques minutes.</li>
        <li><strong>Ouvrez le dossier « $$SITE_FOLDER »</strong>. C'est le dossier de ce site : ce que vous y mettez est publié ici.</li>
        <li><strong>Déposez-y les fichiers de votre site Hugo</strong>, tels qu'ils sont sur votre ordinateur : le fichier <code>hugo.toml</code> et les dossiers <code>content</code>, <code>layouts</code>, <code>themes</code>… Déposez le contenu du dossier, pas une archive ZIP (décompressez-la d'abord).</li>
        <li><strong>Attendez une minute</strong>, puis rechargez cette page : le site se construit tout seul. Pour le changer ensuite, modifiez les fichiers dans le même dossier : il est reconstruit à chaque changement.</li>
        </ol>
        </section>

        <section>
        <h2>Pas encore de site ? Une première page en trois fichiers</h2>
        <p>Dans le dossier « $$SITE_FOLDER » de Nextcloud, le bouton « + Nouveau » crée un dossier ou un fichier texte. Créez ces fichiers, avec exactement ces noms :</p>
        <p class="name">1. <code>hugo.toml</code> (le réglage du site)</p>
        <pre><code>title = "Mon site"</code></pre>
        <p class="name">2. <code>content/_index.md</code> (le texte de la page, dans un dossier <code>content</code>)</p>
        <pre><code>---
        title: "Bienvenue"
        ---
        Ma première page, publiée depuis mon Raspberry Pi.</code></pre>
        <p class="name">3. <code>layouts/index.html</code> (la mise en page, dans un dossier <code>layouts</code>)</p>
        <pre><code>&lt;!doctype html&gt;
        &lt;html lang="fr"&gt;
        &lt;head&gt;&lt;meta charset="utf-8"&gt;&lt;title&gt;{{ .Site.Title }}&lt;/title&gt;&lt;/head&gt;
        &lt;body&gt;&lt;h1&gt;{{ .Title }}&lt;/h1&gt;{{ .Content }}&lt;/body&gt;
        &lt;/html&gt;</code></pre>
        <p>Rechargez cette page une minute plus tard : « Bienvenue » s'affiche à la place de ce texte.</p>
        <h3>Avec un thème</h3>
        <p>Copiez le dossier du thème dans <code>themes</code> (par exemple <code>themes/mon-theme</code>) et ajoutez la ligne <code>theme = "mon-theme"</code> dans <code>hugo.toml</code>. Les thèmes installés comme « modules Hugo » (fichier <code>go.mod</code>) ne sont pas pris en charge : prenez la version à copier dans <code>themes</code>.</p>
        </section>

        <section>
        <h2>Cette page ne change pas ?</h2>
        <ul>
        <li>La console du Pi, sur la fiche de ce site, dit si le site est construit, en cours de construction ou si la construction a échoué.</li>
        <li>En cas d'échec, le fichier <code>.pi-appliance-build.log</code>, dans le même dossier, explique ce qui ne va pas. C'est un fichier caché : dans Nextcloud, ouvrez « Paramètres des fichiers » et cochez « Afficher les fichiers cachés ».</li>
        <li>Une fois le site en ligne, une erreur dans une modification ne le casse pas : la version précédente reste affichée tant que la nouvelle ne se construit pas.</li>
        </ul>
        </section>
        </main>
        </body>
        </html>
        EOF
          mkdir -p /public/next/.pi-path
          cp /public/next/index.html /public/next/.pi-path/index.html
          publish
        }
        mkdir -p /src /work /public /cache
        last=
        while :; do
          current=$$(signature)
          if [ "$$current" != "$$last" ]; then
            last=$$current
            if [ -z "$$(find /src -mindepth 1 -maxdepth 1 ! -name '.pi-appliance-build*' | head -n 1)" ]; then
              rm -f /src/.pi-appliance-build /src/.pi-appliance-build.log
              placeholder
            else
              status building
              find /work -mindepth 1 -maxdepth 1 ! -name node_modules -exec rm -rf {} +
              cp -a /src/. /work/
              rm -f /work/.pi-appliance-build /work/.pi-appliance-build.log
              rm -rf /public/next
              if ! (cd /work && build) > /src/.pi-appliance-build.log 2>&1; then
                echo "La construction a échoué : le site précédent reste en ligne." >> /src/.pi-appliance-build.log
                rm -rf /public/next
                [ -d /public/site ] || placeholder
                status failed
              elif [ ! -f /public/next/index.html ]; then
                echo "Aucune page d'accueil (index.html) produite : le site précédent reste en ligne." >> /src/.pi-appliance-build.log
                rm -rf /public/next
                [ -d /public/site ] || placeholder
                status failed
              else
                publish
                status ok
              fi
            fi
          fi
          sleep 10
        done
    volumes:
      - public:/public
      - work:/work
      - cache:/cache

volumes:
  public:
  work:
  cache:
