# Cockpit derrière Traefik (spécification 6.4, cockpit.sh) : servi sous
# https://<adresse du Pi>/cockpit/, TLS fait par Traefik. Cockpit n'écoute que
# sur 127.0.0.1:9090 (cockpit.socket.d/pi-appliance.conf) : sans chiffrement
# entre Traefik et lui, sur la boucle locale seulement. Sans « Origins », Cockpit
# accepte l'origine de l'adresse demandée (en-tête Host, schéma de
# X-Forwarded-Proto) : https://pi-appliance.local, l'adresse IP du Pi…

[WebService]
UrlRoot = /cockpit/
ProtocolHeader = X-Forwarded-Proto
ForwardedForHeader = X-Forwarded-For
AllowUnencrypted = true
LoginTitle = pi-appliance
