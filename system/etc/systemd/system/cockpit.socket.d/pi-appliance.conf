# Cockpit (paquet cockpit-ws, installé depuis la console par cockpit.sh)
# n'écoute que sur la boucle locale : on l'ouvre par Traefik, qui le réserve à
# la maison et aux administrateurs (dynamic/cockpit.yml). Sans ce réglage, il
# écouterait sur le port 9090 de toutes les interfaces, internet compris.

[Socket]
ListenStream=
ListenStream=127.0.0.1:9090
FreeBind=yes
