# Le nom du Pi est donné par name.sh (spécification 4, TODO-2.56) : cloud-init
# ne doit pas le remplacer par celui des réglages de Raspberry Pi Imager
# (user-data sur la partition de démarrage), à chaque démarrage.
preserve_hostname: true
# /etc/hosts reste celui de name.sh (même nom que le nom d'hôte).
manage_etc_hosts: false
# Wi-Fi des réglages d'Imager (network-config de la partition de démarrage)
# ignoré : cloud-init n'écrit pas de configuration netplan, qui prendrait la
# puce Wi-Fi au Wi-Fi de configuration. Le réseau se choisit dans le portail
# (spécification 4). Le compte et SSH des réglages d'Imager restent appliqués,
# pour se connecter au Pi en cas de panne (décision du 2026-11-20).
network:
  config: disabled
