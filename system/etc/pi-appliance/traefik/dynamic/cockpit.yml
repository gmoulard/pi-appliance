# Administration du système par Cockpit (spécification 6.4), sous /cockpit/ :
# maison seulement (mêmes plages que la console, dynamic/console.yml) et
# réservée aux administrateurs connectés à la console (forward auth
# api/auth/forward-admin), puis connexion à Cockpit avec le compte système
# pi-admin. Tant que Cockpit n'est pas installé (cockpit.sh install), rien
# n'écoute sur 127.0.0.1:9090 : Traefik répond « Bad Gateway ».

http:
  routers:
    # Priorité 2 : au-dessus de la console (1), sous les routeurs des services
    # (longueur de leur règle), qui gardent /cockpit sur leur propre adresse.
    pi-appliance-cockpit:
      entryPoints: [websecure]
      rule: >-
        PathPrefix(`/cockpit`) &&
        (ClientIP(`10.0.0.0/8`) ||
        ClientIP(`172.16.0.0/12`) ||
        ClientIP(`192.168.0.0/16`) ||
        ClientIP(`127.0.0.0/8`) ||
        ClientIP(`::1/128`) ||
        ClientIP(`fc00::/7`) ||
        ClientIP(`fe80::/10`))
      priority: 2
      middlewares: [pi-appliance-admin]
      service: pi-appliance-cockpit
      tls: {}

  middlewares:
    # Comme pi-appliance-auth (dynamic/console.yml), réservé aux administrateurs :
    # une autre personne connectée reçoit « 403 ».
    pi-appliance-admin:
      forwardAuth:
        address: "http://127.0.0.1:8080/pi-appliance/api/auth/forward-admin"
        authResponseHeaders: [Remote-User, Remote-Email, Remote-Groups]

  services:
    pi-appliance-cockpit:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9090"
