# Cockpit, administration du système du Pi (spécification 6.4), sous /cockpit/ :
# maison seulement (mêmes plages que la console, dynamic/console.yml) et
# réservée aux administrateurs connectés à la console (forward auth
# api/auth/forward-cockpit), avec connexion unique : la console donne à
# Cockpit le compte système de l'administrateur (en-tête Authorization) et ses
# droits sur le Pi (X-Superuser), sans second mot de passe. Tant que Cockpit n'est pas installé (cockpit.sh install), rien
# n'écoute sur 127.0.0.1:9090 : la console sert sa page « service
# indisponible » (pi-appliance-errors, dynamic/console.yml).
# Ouvert plus largement par un administrateur (TODO-3.4) : aussi aux
# utilisateurs (api/auth/forward-cockpit les admet), et aussi depuis internet
# (routeur pi-appliance-cockpit-internet écrit par la console dans
# console-internet.yml, avec ces mêmes middlewares).

http:
  routers:
    # Priorité 2 : au-dessus du dernier recours (1), sous les routeurs des services
    # (longueur de leur règle), qui gardent /cockpit sur leur propre adresse.
    pi-appliance-cockpit:
      entryPoints: [websecure]
      rule: >-
        PathPrefix(`/cockpit`) &&
        (ClientIP(`10.0.0.0/8`) ||
        ClientIP(`172.16.0.0/12`) ||
        ClientIP(`192.168.0.0/16`) ||
        ClientIP(`127.0.0.0/8`) ||
        ClientIP(`::1/128`) ||
        ClientIP(`fc00::/7`) ||
        ClientIP(`fe80::/10`))
      priority: 2
      middlewares: [pi-appliance-errors, pi-appliance-cockpit]
      service: pi-appliance-cockpit
      tls: {}

  middlewares:
    # Comme pi-appliance-auth (dynamic/console.yml), réservé aux administrateurs
    # (et aux utilisateurs si un administrateur l'a permis) : une autre personne
    # connectée reçoit « 403 ». Authorization et X-Superuser
    # sont toujours remplacés, ou retirés si la console ne les donne pas : un
    # visiteur ne peut pas les forger.
    pi-appliance-cockpit:
      forwardAuth:
        address: "http://127.0.0.1:8080/pi-appliance/api/auth/forward-cockpit"
        authResponseHeaders: [Remote-User, Remote-Email, Remote-Groups, Authorization, X-Superuser]
    # Ancien nom (versions 0.1.25 et avant), gardé pour une configuration
    # copiée à la main ; plus utilisé ici.
    pi-appliance-admin:
      forwardAuth:
        address: "http://127.0.0.1:8080/pi-appliance/api/auth/forward-admin"
        authResponseHeaders: [Remote-User, Remote-Email, Remote-Groups]

  services:
    pi-appliance-cockpit:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9090"
