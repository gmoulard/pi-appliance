# Configuration dynamique de Traefik : console, portail captif, pages
# d'erreur, certificat local.

http:
  routers:
    # Console sous /pi-appliance depuis un réseau privé/local. ClientIP utilise
    # l'adresse TCP vue par Traefik, pas un en-tête fourni par le client. Les
    # routeurs des services gardent la priorité, même pour ce chemin.
    # Avant de brancher un relais, exclure l'adresse du pair : le trafic relayé
    # apparaît ici avec l'adresse source du tunnel.
    # Le préfixe IPv6 global de la maison, qui change avec la box, a son
    # routeur dans dynamic/home.yml (pi-appliance-console-home6).
    pi-appliance-console:
      entryPoints: [websecure]
      rule: >-
        PathPrefix(`/pi-appliance`) &&
        (ClientIP(`10.0.0.0/8`) ||
        ClientIP(`172.16.0.0/12`) ||
        ClientIP(`192.168.0.0/16`) ||
        ClientIP(`127.0.0.0/8`) ||
        ClientIP(`::1/128`) ||
        ClientIP(`fc00::/7`) ||
        ClientIP(`fe80::/10`))
      priority: 2
      service: pi-appliance-console
      tls: {}
    # Dernier recours (priorité 1, sous tous les autres) : adresse ou chemin
    # sans routeur (service arrêté ou désinstallé, console demandée depuis
    # internet) ; la console sert sa page « introuvable » (code 404), avec son
    # pied de page, au lieu du « 404 page not found » de Traefik. Le chemin est
    # toujours remplacé : rien d'autre de la console n'est joint ainsi.
    pi-appliance-not-found:
      entryPoints: [websecure]
      rule: "PathPrefix(`/`)"
      priority: 1
      middlewares: [pi-appliance-not-found]
      service: pi-appliance-errors
      tls: {}
    # NE PAS élargir : seule la demande api/hello de l'application mobile
    # (nom, version, empreinte de la clé publique, adresses des services ;
    # spécification 5.2) répond aussi depuis internet. Chemin exact, lecture
    # seule ; le reste de la console reste fermé sur internet (8.3). Priorité 3 :
    # devant la console, derrière les routeurs des services.
    pi-appliance-hello:
      entryPoints: [websecure]
      rule: >-
        Path(`/pi-appliance/api/hello`) &&
        (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      priority: 3
      service: pi-appliance-console
      tls: {}
    # Adresse nue (https://pi-appliance.local/) : la console y renvoie vers
    # /pi-appliance/ ; sur l'adresse d'un service sans routeur (arrêté, ou qui
    # redémarre en boucle), elle sert sa page « service indisponible ».
    pi-appliance-root:
      entryPoints: [websecure]
      rule: "Path(`/`)"
      middlewares: [pi-appliance-root]
      service: pi-appliance-errors
      tls: {}
    # Portail captif : sur le point d'accès Wi-Fi (10.42.0.0/24), toute page
    # demandée en HTTP mène à la console. Les téléphones ouvrent alors d'eux-mêmes
    # la page de connexion au réseau.
    pi-appliance-captive:
      entryPoints: [web]
      rule: "ClientIP(`10.42.0.0/24`)"
      middlewares: [pi-appliance-captive]
      service: noop@internal
      priority: 100

  middlewares:
    pi-appliance-not-found:
      replacePath:
        path: "/pi-appliance/erreur/404"
    # Service qui ne répond pas (en train de démarrer, en panne) : page
    # « service indisponible » de la console. Posé en premier sur le routeur de
    # chaque service de la marketplace (internal/services, errorsMiddleware) et
    # sur Cockpit. Pas sur la console : ses réponses 502 et 503 sont du JSON.
    pi-appliance-errors:
      errors:
        status: ["502-504"]
        service: pi-appliance-errors
        query: "/pi-appliance/erreur/{status}"
    pi-appliance-root:
      replacePath:
        path: "/pi-appliance/erreur/racine"
    pi-appliance-captive:
      redirectRegex:
        regex: ".*"
        replacement: "https://10.42.0.1/pi-appliance/"
    # Authentification déléguée à la console (spécification 8.1) : un service
    # « utilisateurs connectés » ajoute à son routeur le label
    # traefik.http.routers.<routeur>.middlewares=pi-appliance-auth@file.
    # Sans session, la console renvoie vers sa page de connexion. Les en-têtes
    # Remote-* sont toujours remplacés par ceux de la console : un visiteur ne
    # peut pas les forger.
    pi-appliance-auth:
      forwardAuth:
        address: "http://127.0.0.1:8080/pi-appliance/api/auth/forward"
        authResponseHeaders: [Remote-User, Remote-Email, Remote-Groups]
    # Service réservé aux administrateurs (accès « admins » d'un manifeste,
    # Portainer : il a la main sur tout le Pi). Toujours après
    # pi-appliance-home : label
    # traefik.http.routers.<routeur>.middlewares=pi-appliance-home@file,pi-appliance-admins@file.
    # Un autre compte reçoit « 403 » ; sans session, connexion à la console.
    pi-appliance-admins:
      forwardAuth:
        address: "http://127.0.0.1:8080/pi-appliance/api/auth/forward-service-admin"
        authResponseHeaders: [Remote-User, Remote-Email, Remote-Groups]
    # Etherpad « utilisateurs connectés » (spécification 6.3, 8.2) : comme
    # pi-appliance-auth, et un lien de partage ouvre un seul document à une
    # personne sans compte. Authorization connecte au compte interne
    # d'Etherpad ; il est toujours remplacé par celui de la console (ou retiré) :
    # un visiteur ne peut pas le forger.
    pi-appliance-pad:
      forwardAuth:
        address: "http://127.0.0.1:8080/pi-appliance/api/auth/forward-pad"
        authResponseHeaders: [Remote-User, Remote-Email, Remote-Groups, Authorization]
    # Service « maison seulement » (spécification 8.2) : middleware
    # pi-appliance-home, dans dynamic/home.yml, réécrit par la console avec le
    # préfixe IPv6 global de la maison (mêmes plages que la console ci-dessus).

  services:
    pi-appliance-console:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
    # La même console, pour les pages d'erreur seulement (chemin
    # /pi-appliance/erreur/<code>, posé par les middlewares ci-dessus).
    pi-appliance-errors:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"

tls:
  options:
    default:
      minVersion: VersionTLS12
  stores:
    default:
      # Certificat local auto-signé, propre à chaque Pi (secrets.sh). Le
      # navigateur affiche une alerte, expliquée dans le portail et le guide.
      # Chaque service en .local a le sien, listé par mdns.sh dans
      # services-tls.yml et choisi d'après le nom demandé.
      defaultCertificate:
        certFile: /etc/traefik/tls/local.crt
        keyFile: /etc/traefik/tls/local.key
