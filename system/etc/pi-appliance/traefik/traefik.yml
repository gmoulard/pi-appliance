# Configuration statique de Traefik (monté en /etc/traefik/traefik.yml).

global:
  checkNewVersion: false
  sendAnonymousUsage: false
  # En-têtes au nom trompeur (X_Forwarded_For pour X-Forwarded-For) supprimés :
  # PHP (Nextcloud…) les lirait comme les en-têtes posés par Traefik.
  aliasHeadersStrategy: delete

log:
  level: WARN

entryPoints:
  web:
    address: ":80"
    http:
      # Tout HTTP vers HTTPS (spécification 8.4). Priorité basse : le portail
      # captif (dynamic/console.yml) passe avant pour les appareils du point d'accès.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          priority: 1
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  # Services de la marketplace : labels posés par la console (internal/services),
  # sur le réseau Docker « pi-appliance ».
  docker:
    exposedByDefault: false
    network: pi-appliance
  # Console, portail captif et certificat local.
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Let's Encrypt, à l'étape Internet (spécification 7) : décommenter ce bloc, puis
# ajouter aux routeurs le label « traefik.http.routers.<nom>.tls.certresolver=letsencrypt ».
# Le défi HTTP passe par le port 80, déjà ouvert. Le certificat local reste
# utilisé pour les adresses sans certificat (pi-appliance.local, adresse IP).
#
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: administrateur@example.org
#       storage: /var/lib/traefik/acme.json
#       httpChallenge:
#         entryPoint: web
