# Traefik, point d'entrée unique du Pi (spécification, sections 8.4 et 10).
# Réseau de l'hôte : Traefik écoute directement sur les ports 80 et 443 du Pi,
# joint la console sur 127.0.0.1:8080 (fermée au réseau) et les services sur le
# réseau Docker « pi-appliance ». Démarré par pi-appliance-traefik.service.

name: pi-appliance-traefik

services:
  traefik:
    # Version fixée : l'image du Pi embarque exactement celle-ci (image/build.sh).
    image: traefik:v3.7.19
    container_name: pi-appliance-traefik
    restart: always
    network_mode: host
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - /etc/pi-appliance/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /etc/pi-appliance/traefik/dynamic:/etc/traefik/dynamic:ro
      - /var/lib/pi-appliance/system/tls:/etc/traefik/tls:ro
      # Certificats Let's Encrypt (acme.json).
      - /var/lib/pi-appliance/system/traefik:/var/lib/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
