# Portail captif du point d'accès « pi-appliance » (lu par le dnsmasq de
# NetworkManager, mode « shared ») : tous les noms mènent au Pi, et les
# téléphones récents reçoivent l'adresse du portail (RFC 8910).
address=/#/10.42.0.1
dhcp-option=114,"https://10.42.0.1/pi-appliance/"
