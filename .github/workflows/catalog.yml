---
name: Catalogue

on:
  push:
    branches: [master]
    paths:
      - "marketplace/**"
      - "cmd/marketplace-json/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Manifestes
        run: go test ./marketplace/...
      - name: Catalogue publié
        run: go run ./cmd/marketplace-json
      - name: Envoi sur master
        run: |
          set -eu
          git add -A docs/static
          if git diff --cached --quiet; then
            echo "Catalogue publié déjà à jour."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Catalogue publié régénéré"
          for _ in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            git fetch origin master
            git reset --hard origin/master
            go run ./cmd/marketplace-json
            git add -A docs/static
            if git diff --cached --quiet; then
              echo "Catalogue publié mis à jour entre-temps."
              exit 0
            fi
            git commit -m "Catalogue publié régénéré"
          done
          exit 1
