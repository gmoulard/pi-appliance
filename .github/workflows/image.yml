# Image système pi-appliance (pi-gen), publiée avec sa somme de contrôle.
# Seulement sur une étiquette de version (v…) ou à la demande : une
# construction prend environ une heure. À la demande, « image » décoché :
# socle seul (archive de mise à jour des Pi déjà installés), en quelques
# minutes ; la version publiée renvoie alors à la dernière image.

---
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image:
        description: "Construire aussi l'image à flasher (sinon le socle seul)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Image construite, sauf à la demande avec « image » décoché.
      WITH_IMAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.image }}
    permissions:
      contents: write  # publication de la version (gh release)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # NE PAS déplacer l'étiquette quand ce contrôle échoue : publier une
      # nouvelle version (skill release).
      - name: Étiquette et fichier VERSION
        if: github.ref_type == 'tag'
        run: |
          set -eu
          expected="v$(tr -d '[:space:]' <VERSION)"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::étiquette ${GITHUB_REF_NAME}, fichier VERSION $expected"
            exit 1
          fi
      # Sur une étiquette, la console porte exactement son numéro (v1.2.3) :
      # elle le compare à la dernière version publiée et l'annonce après une
      # mise à jour (updates.sh appliance).
      - name: Console arm64
        run: |
          set -eu
          go test ./...
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version=${GITHUB_REF_NAME}; else version=$(date +%Y-%m-%d)-${GITHUB_SHA::7}; fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          # Commit et sa date : pied de page de la console (TODO-5.21).
          ldflags="-X main.version=$version -X main.commit=${GITHUB_SHA} -X main.date=$(git log -1 --format=%cs)"
          GOOS=linux GOARCH=arm64 go build -ldflags "$ldflags" -o pi-appliance-arm64 ./cmd/pi-appliance
      - name: Place sur le disque
        if: env.WITH_IMAGE == 'true'
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Image (pi-gen)
        if: env.WITH_IMAGE == 'true'
        run: |
          set -eu
          IMG_VERSION=$VERSION image/build.sh pi-appliance-arm64 deploy
      - name: Archive de mise à jour
        run: sh image/update-archive.sh pi-appliance-arm64 "$VERSION" deploy
      - uses: actions/upload-artifact@v7
        with:
          name: pi-appliance-image
          path: deploy/*
          retention-days: 14
          compression-level: 0
      - name: Publication
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Une étiquette avec suffixe (v1.3.0-beta.1) est une préversion :
          # proposée seulement sur le canal bêta (spécification 5.4).
          prerelease=
          case "${GITHUB_REF_NAME}" in *-*) prerelease=--prerelease ;; esac
          if [ "$WITH_IMAGE" = true ]; then
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" $prerelease deploy/*.img.xz deploy/*.img.xz.sha256 \
              deploy/*-arm64.tar.gz deploy/*-arm64.tar.gz.sha256 \
              --title "pi-appliance ${GITHUB_REF_NAME}" \
              --notes "Image à flasher sur une carte SD (Raspberry Pi 5, 4, 3 B+, Zero 2 W).
          Vérifier le fichier avec sa somme de contrôle : sha256sum -c *.sha256
          Les Pi déjà installés proposent cette version dans la console (Mon Pi, Mises à jour) : archive pi-appliance-${GITHUB_REF_NAME}-arm64.tar.gz."
          else
            # Socle seul : la dernière version qui a une image, pour le flashage.
            last=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
              --jq '[.[] | select(any(.assets[]; .name | endswith(".img.xz")))][0].tag_name // empty')
            notes=$(printf '%s %s\n%s %s' \
              "Mise à jour du socle seulement, sans nouvelle image : les Pi déjà installés proposent cette version" \
              "dans la console (Mon Pi, Mises à jour) : archive pi-appliance-${GITHUB_REF_NAME}-arm64.tar.gz." \
              "Pour flasher une carte SD, prenez l'image de la version ${last:-précédente}" \
              "(https://github.com/${GITHUB_REPOSITORY}/releases/tag/${last}), puis mettez le Pi à jour depuis la console.")
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" $prerelease \
              deploy/*-arm64.tar.gz deploy/*-arm64.tar.gz.sha256 \
              --title "pi-appliance ${GITHUB_REF_NAME}" \
              --notes "$notes"
          fi
