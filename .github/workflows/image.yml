# Image système pi-appliance (pi-gen), publiée avec sa somme de contrôle.
# Seulement sur une étiquette de version (v…) ou à la demande : une
# construction prend environ une heure.

---
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write  # publication de la version (gh release)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # NE PAS déplacer l'étiquette quand ce contrôle échoue : publier une
      # nouvelle version (skill release).
      - name: Étiquette et fichier VERSION
        if: github.ref_type == 'tag'
        run: |
          set -eu
          expected="v$(tr -d '[:space:]' <VERSION)"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::étiquette ${GITHUB_REF_NAME}, fichier VERSION $expected"
            exit 1
          fi
      # Sur une étiquette, la console porte exactement son numéro (v1.2.3) :
      # elle le compare à la dernière version publiée et l'annonce après une
      # mise à jour (updates.sh appliance).
      - name: Console arm64
        run: |
          set -eu
          go test ./...
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version=${GITHUB_REF_NAME}; else version=$(date +%Y-%m-%d)-${GITHUB_SHA::7}; fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$version" -o pi-appliance-arm64 ./cmd/pi-appliance
      - name: Place sur le disque
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Image (pi-gen)
        run: |
          set -eu
          IMG_VERSION=$VERSION image/build.sh pi-appliance-arm64 deploy
      - name: Archive de mise à jour
        run: sh image/update-archive.sh pi-appliance-arm64 "$VERSION" deploy
      - uses: actions/upload-artifact@v4
        with:
          name: pi-appliance-image
          path: deploy/*
          retention-days: 14
          compression-level: 0
      - name: Publication
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" deploy/*.img.xz deploy/*.img.xz.sha256 \
            deploy/*-arm64.tar.gz deploy/*-arm64.tar.gz.sha256 \
            --title "pi-appliance ${GITHUB_REF_NAME}" \
            --notes "Image à flasher sur une carte SD (Raspberry Pi 5, 4, 3 B+, Zero 2 W).
          Vérifier le fichier avec sa somme de contrôle : sha256sum -c *.sha256
          Les Pi déjà installés proposent cette version dans la console (Mon Pi, Mises à jour) : archive pi-appliance-${GITHUB_REF_NAME}-arm64.tar.gz."
