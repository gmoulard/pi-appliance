# Étiquette de version posée sans git : vX.Y.Z d'après le fichier VERSION,
# sur le dernier commit de master, puis lancement du workflow « Image », qui
# construit l'image et crée lui-même la version GitHub. Une étiquette poussée
# avec le jeton du workflow ne lance aucun workflow : « Image » est donc
# lancé à la demande sur l'étiquette.
# NE PAS créer la version à la main depuis la page Releases : « Image »
# échouerait (version déjà là) et les Pi verraient une version sans archive.

---
name: Tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Étiquette d'après VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v$(tr -d '[:space:]' <VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::l'étiquette $tag existe déjà : changer VERSION (skill release)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "pi-appliance $tag"
          git push origin "$tag"
          gh workflow run image.yml --ref "$tag"
          echo "Étiquette $tag posée sur ${GITHUB_SHA::7}, workflow « Image » lancé." >>"$GITHUB_STEP_SUMMARY"
