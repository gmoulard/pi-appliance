---
name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o pi-appliance-arm64 ./cmd/pi-appliance
      - uses: actions/upload-artifact@v7
        with:
          name: pi-appliance-arm64
          path: pi-appliance-arm64
