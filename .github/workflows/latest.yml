# « Dernière version » : remet le titre de dernière version GitHub
# (releases/latest, proposée aux consoles du canal stable) sur la version
# stable la plus haute publiée, par exemple après une version plus ancienne
# publiée plus tard (deux constructions en parallèle).
---
name: Dernière version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - name: Version stable la plus haute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo "::error::aucune version publiée"
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          echo "Dernière version : $tag." >>"$GITHUB_STEP_SUMMARY"
