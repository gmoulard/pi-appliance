# Vérification de la couche système : shellcheck sur tous les scripts, YAML,
# règles du point d'accès Wi-Fi, préparation de pi-gen sans construction.

---
name: Système

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Outils
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint jq iproute2 nftables iputils-ping
          shellcheck --version
      - name: shellcheck
        run: |
          set -eu
          scripts=$(grep -rlE '^#!/bin/(ba)?sh' image system)
          echo "$scripts"
          # shellcheck disable=SC2086
          shellcheck -x $scripts system/usr/local/lib/pi-appliance/*.sh
          shellcheck -s bash image/config image/stage-pi-appliance/EXPORT_IMAGE
      - name: set -eu et licence
        run: |
          set -eu
          status=0
          for f in $(grep -rlE '^#!/bin/(ba)?sh' image system) system/usr/local/lib/pi-appliance/*.sh; do
            grep -qx 'set -eu' "$f" || { echo "$f : « set -eu » manquant"; status=1; }
          done
          for f in $(find image system -type f ! -name '*.json') .github/workflows/image.yml .github/workflows/system.yml; do
            grep -q 'GNU Affero General Public License' "$f" || { echo "$f : en-tête de licence manquant"; status=1; }
          done
          exit "$status"
      - name: YAML
        run: yamllint -c .yamllint.yml .github/workflows/image.yml .github/workflows/system.yml system
      - name: Accès à la console dans Traefik
        run: sh system/tests/traefik-console-test.sh
      - name: Règles du point d'accès
        run: sh system/tests/ap-rules-test.sh
      - name: Pare-feu du point d'accès
        run: sudo sh system/tests/ap-firewall-test.sh
      - name: Disques USB
        run: sh system/tests/storage-test.sh
      - name: Nom du Pi
        run: sh system/tests/name-test.sh
      - name: Choix du disque de sauvegarde
        run: sh system/tests/backup-disk-test.sh
      - name: Correctifs du système
        run: sh system/tests/updates-test.sh
      - name: Administration du système (Cockpit)
        run: sh system/tests/cockpit-test.sh
      - name: pi-gen (préparation, sans construction)
        run: |
          set -eu
          GOOS=linux GOARCH=arm64 go build -o pi-appliance-arm64 ./cmd/pi-appliance
          DRY_RUN=1 image/build.sh pi-appliance-arm64
