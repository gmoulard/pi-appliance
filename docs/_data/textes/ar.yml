accueil:
  titre: "pi-appliance — خادمك، في منزلك"
  description: "يحوّل pi-appliance جهاز Raspberry Pi إلى خادم شخصي، في المنزل وعلى الإنترنت: صورة نظام واحدة، ووحدة تحكم واحدة، وتطبيق هاتف واحد. إصدار تجريبي."
  pastille: "إصدار تجريبي لأجهزة Raspberry Pi 5 و4 و3 B+ وZero 2 W"
  h1: "خادمك، <span>في منزلك.</span>"
  chapeau: "وحدة تحكم بلغتك (12 لغة) لتثبيت خدماتك وإدارتها في منزلك. صورة النظام مُعتمدة على Raspberry Pi 3 B+ وRaspberry Pi 4."
  carte: "هدف المشروع: أقل من 15 دقيقة بين بطاقة SD وخدمة جاهزة للاستخدام، في المنزل وعلى الإنترنت. تبقى كل بياناتك عندك، في أمان. ما زال هذا الإصدار تجريبيًا."
  voir_avancement: "عرض التقدّم"
  lire_guide: "قراءة الدليل"
  parcours: "المسار المستهدف"
  etapes:
    - titre: "انسخ الصورة"
      texte: "انسخ صورة pi-appliance على بطاقة SD."
    - titre: "وصّل الجهاز"
      texte: "يبدأ تشغيل الـPi. إن لم توجد شبكة، ينشئ شبكة Wi-Fi باسم «pi-appliance»: اختر منها شبكة منزلك من هاتفك."
    - titre: "اختر"
      texte: "ثبّت تطبيقاتك من وحدة التحكم. الوصول من الإنترنت من الخطوات القادمة."
  parcours_note: "هذا المسار مُعتمد على Raspberry Pi 3 B+ وRaspberry Pi 4؛ ولم تتم تجربة Pi 5 وPi Zero 2 W بعد."
  parties: "ثلاثة أجزاء، واسم واحد"
  trois:
    - titre: "صورة النظام"
      texte: "نظام الـPi، جاهز للاستخدام، يُنسخ على بطاقة SD."
    - titre: "القاعدة ووحدة التحكم"
      texte: "مثبّتة دائمًا على الـPi: صفحة ويب لضبط الـPi وتثبيت خدماتك، وأدواتها، ومنها الأمر pia."
    - titre: "تطبيق الهاتف"
      texte: "الدليل مقروء دون شبكة، واختصار إلى أجهزة Pi الخاصة بك على الهاتف."
  applications: "التطبيقات"
  catalogue_complet: "عرض الكتالوج كاملًا، والتطبيقات المخطط لها، وكيفية المساهمة في الـmarketplace."
  adresse: "عنوانك على الإنترنت"
  adresse_texte: "العنوان العام <span class=\"mono\">cloud.<b>your-name</b>.pi-appliance.com</span> والوصول من الإنترنت غير متاحين بعد."
  adresse_champ: "اسم عنوانك"
  adresse_exemple: "your-name"
  reserver: "حجز هذا العنوان"
  reserver_note: "حجز العناوين مخطط له في مرحلة لاحقة من المشروع."
  telecharger: "تنزيل صورة النظام"
  telecharger_valide: "صورة النظام مُعتمدة على Raspberry Pi 3 B+ وRaspberry Pi 4."
  telecharger_texte: "ما زال هذا إصدارًا تجريبيًا، دون ضمان: احتفظ بنسخة من ملفاتك المهمة. تشرح صفحة التثبيت كيفية التحقق من الملف ونسخ الصورة. يُحدَّث الـPi المثبّت مسبقًا من وحدة التحكم («الـPi الخاص بي»، «التحديثات»). إن لم يكن لأحدث إصدار صورة نظام (تحديث للقاعدة فقط)، فصفحته تعطي رابط أحدث صورة."
  telecharger_bouton: "تنزيل أحدث إصدار"
  telecharger_instructions: "قراءة تعليمات التثبيت"
