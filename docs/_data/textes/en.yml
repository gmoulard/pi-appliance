accueil:
  titre: "pi-appliance — your server, at home"
  description: "pi-appliance turns a Raspberry Pi into a personal server, at home and on the internet: one image, one console, one mobile app. Experimental version."
  pastille: "Experimental version for Raspberry Pi 5, 4, 3 B+ and Zero 2 W"
  h1: "Your server, <span>at home.</span>"
  chapeau: "A console in your language (12 languages) to install and manage your services at home. The system image is validated on Raspberry Pi 3 B+ and Raspberry Pi 4."
  carte: "The project’s goal: less than 15 minutes from the SD card to a ready-to-use service, at home and on the internet. All your data stays with you, safely. This version is still experimental."
  voir_avancement: "See the progress"
  lire_guide: "Read the guide"
  parcours: "The intended journey"
  etapes:
    - titre: "Flash"
      texte: "Copy the pi-appliance image to an SD card."
    - titre: "Plug in"
      texte: "The Pi starts. With no network, it creates a “pi-appliance” Wi-Fi: choose your home Wi-Fi from your phone."
    - titre: "Choose"
      texte: "Install your applications from the console. Access from the internet is one of the next steps."
  parcours_note: "This journey is validated on Raspberry Pi 3 B+ and Raspberry Pi 4; the Pi 5 and the Pi Zero 2 W are still to be tried."
  parties: "Three parts, one name"
  trois:
    - titre: "The image"
      texte: "The Pi’s system, ready to use, to copy to the SD card."
    - titre: "The base and its console"
      texte: "Always installed on the Pi: a web page to set up the Pi and install your services, and its tools, including the pia command."
    - titre: "The mobile app"
      texte: "The guide, readable without a network, and a shortcut to your Pis on your phone."
  applications: "The applications"
  catalogue_complet: "See the full catalogue, the planned applications and how to contribute to the marketplace."
  adresse: "Your address on the internet"
  adresse_texte: "The public address <span class=\"mono\">cloud.<b>your-name</b>.pi-appliance.com</span> and access from the internet are not available yet."
  adresse_champ: "Name of your address"
  adresse_exemple: "your-name"
  reserver: "Reserve this address"
  reserver_note: "Reserving addresses is planned for a later stage of the project."
  telecharger: "Download the image"
  telecharger_valide: "The image is validated on Raspberry Pi 3 B+ and Raspberry Pi 4."
  telecharger_texte: "This is still an experimental version, with no warranty: keep a copy of your important files. The installation page explains how to check the file and flash the image. A Pi that is already installed updates itself from the console (“My Pi”, “Updates”). If the latest version has no image (update of the base only), its page gives the link to the latest image."
  telecharger_bouton: "Download the latest version"
  telecharger_instructions: "Read the installation instructions"
