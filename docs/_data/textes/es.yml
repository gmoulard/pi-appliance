accueil:
  titre: "pi-appliance — su servidor, en casa"
  description: "pi-appliance convierte una Raspberry Pi en un servidor personal, en casa y en internet: una imagen, una consola, una aplicación móvil. Versión experimental."
  pastille: "Versión experimental para Raspberry Pi 5, 4, 3 B+ y Zero 2 W"
  h1: "Su servidor, <span>en casa.</span>"
  chapeau: "Una consola en su idioma (12 idiomas) para instalar y gestionar sus servicios en casa. La imagen del sistema está validada en Raspberry Pi 3 B+ y Raspberry Pi 4."
  carte: "Objetivo del proyecto: menos de 15 minutos entre la tarjeta SD y un servicio listo para usar, en casa y en internet. Todos sus datos se quedan en su casa, seguros. Esta versión todavía es experimental."
  voir_avancement: "Ver el avance"
  lire_guide: "Leer la guía"
  parcours: "El recorrido previsto"
  etapes:
    - titre: "Grabe"
      texte: "Copie la imagen pi-appliance en una tarjeta SD."
    - titre: "Conecte"
      texte: "La Pi arranca. Sin red, crea una Wi-Fi «pi-appliance»: elija la de su casa desde su teléfono."
    - titre: "Elija"
      texte: "Instale sus aplicaciones desde la consola. El acceso desde internet forma parte de los próximos pasos."
  parcours_note: "Este recorrido está validado en Raspberry Pi 3 B+ y Raspberry Pi 4; la Pi 5 y la Pi Zero 2 W quedan por probar."
  parties: "Tres partes, un solo nombre"
  trois:
    - titre: "La imagen"
      texte: "El sistema de la Pi, listo para usar, para copiar en la tarjeta SD."
    - titre: "La base y su consola"
      texte: "Siempre instalada en la Pi: una página web para configurar la Pi e instalar sus servicios, y sus herramientas, entre ellas el comando pia."
    - titre: "La aplicación móvil"
      texte: "La guía, legible sin red, y un acceso directo a sus Pi en el teléfono."
  applications: "Las aplicaciones"
  catalogue_complet: "Ver el catálogo completo, las aplicaciones previstas y cómo contribuir a la marketplace."
  adresse: "Su dirección en internet"
  adresse_texte: "La dirección pública <span class=\"mono\">cloud.<b>su-nombre</b>.pi-appliance.com</span> y el acceso desde internet aún no están disponibles."
  adresse_champ: "Nombre de su dirección"
  adresse_exemple: "su-nombre"
  reserver: "Reservar esta dirección"
  reserver_note: "La reserva de direcciones está prevista en una etapa posterior del proyecto."
  telecharger: "Descargar la imagen"
  telecharger_valide: "La imagen está validada en Raspberry Pi 3 B+ y Raspberry Pi 4."
  telecharger_texte: "Todavía es una versión experimental, sin garantía: guarde una copia de sus archivos importantes. La página de instalación explica cómo comprobar el archivo y grabar la imagen. Una Pi ya instalada se actualiza desde la consola («Mi Pi», «Actualizaciones»). Si la última versión no tiene imagen (actualización solo de la base), su página da el enlace de la última imagen."
  telecharger_bouton: "Descargar la última versión"
  telecharger_instructions: "Leer las instrucciones de instalación"
