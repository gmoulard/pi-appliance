accueil:
  titre: "pi-appliance — il suo server, a casa"
  description: "pi-appliance trasforma un Raspberry Pi in un server personale, a casa e su internet: un'immagine, una console, un'app mobile. Versione sperimentale."
  pastille: "Versione sperimentale per Raspberry Pi 5, 4, 3 B+ e Zero 2 W"
  h1: "Il suo server, <span>a casa.</span>"
  chapeau: "Una console nella sua lingua (12 lingue) per installare e gestire i suoi servizi a casa. L’immagine di sistema è convalidata su Raspberry Pi 3 B+ e Raspberry Pi 4."
  carte: "Obiettivo del progetto: meno di 15 minuti tra la scheda SD e un servizio pronto all’uso, a casa e su internet. Tutti i suoi dati restano a casa sua, al sicuro. Questa versione è ancora sperimentale."
  voir_avancement: "Vedere l’avanzamento"
  lire_guide: "Leggere la guida"
  parcours: "Il percorso previsto"
  etapes:
    - titre: "Scriva"
      texte: "Copi l’immagine pi-appliance su una scheda SD."
    - titre: "Colleghi"
      texte: "Il Pi si avvia. Senza rete, crea un Wi-Fi «pi-appliance»: scelga quello di casa dal suo telefono."
    - titre: "Scelga"
      texte: "Installi le sue applicazioni dalla console. L’accesso da internet fa parte dei prossimi passi."
  parcours_note: "Questo percorso è convalidato su Raspberry Pi 3 B+ e Raspberry Pi 4; il Pi 5 e il Pi Zero 2 W sono ancora da provare."
  parties: "Tre parti, un solo nome"
  trois:
    - titre: "L’immagine"
      texte: "Il sistema del Pi, pronto all’uso, da copiare sulla scheda SD."
    - titre: "La base e la sua console"
      texte: "Sempre installata sul Pi: una pagina web per configurare il Pi e installare i suoi servizi, e i suoi strumenti, tra cui il comando pia."
    - titre: "L’app mobile"
      texte: "La guida, leggibile senza rete, e una scorciatoia verso i suoi Pi sul telefono."
  applications: "Le applicazioni"
  catalogue_complet: "Vedere il catalogo completo, le applicazioni previste e come contribuire alla marketplace."
  adresse: "Il suo indirizzo su internet"
