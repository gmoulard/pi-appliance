accueil:
  titre: "pi-appliance — あなたのサーバーを、自宅に"
  description: "pi-appliance は Raspberry Pi を、自宅でもインターネットでも使える個人サーバーにします。イメージ、コンソール、モバイルアプリがひとつに。実験版です。"
  pastille: "Raspberry Pi 5、4、3 B+、Zero 2 W 向けの実験版"
  h1: "あなたのサーバーを、<span>自宅に。</span>"
  chapeau: "自宅のサービスをインストールして管理するための、あなたの言語（12 言語）のコンソール。システムイメージは Raspberry Pi 3 B+ と Raspberry Pi 4 で検証済みです。"
  carte: "プロジェクトの目標：SD カードからすぐに使えるサービスまで 15 分以内、自宅でもインターネットでも。データはすべて安全にあなたの手元に残ります。このバージョンはまだ実験的です。"
  voir_avancement: "進捗を見る"
  lire_guide: "ガイドを読む"
  parcours: "目指す流れ"
  etapes:
    - titre: "書き込む"
      texte: "pi-appliance のイメージを SD カードにコピーします。"
    - titre: "つなぐ"
      texte: "Pi が起動します。ネットワークがなければ「pi-appliance」という Wi-Fi を作ります。スマートフォンから自宅の Wi-Fi を選んでください。"
    - titre: "選ぶ"
      texte: "コンソールからアプリをインストールします。インターネットからのアクセスは次の段階で対応します。"
  parcours_note: "この流れは Raspberry Pi 3 B+ と Raspberry Pi 4 で検証済みです。Pi 5 と Pi Zero 2 W はまだ試していません。"
  parties: "3 つの部分、ひとつの名前"
  trois:
    - titre: "イメージ"
      texte: "すぐに使える Pi のシステム。SD カードにコピーします。"
    - titre: "基盤とコンソール"
      texte: "Pi に常にインストールされています。Pi を設定してサービスをインストールするためのウェブページと、pia コマンドなどのツールです。"
    - titre: "モバイルアプリ"
      texte: "ネットワークなしでも読めるガイドと、スマートフォンからあなたの Pi へのショートカット。"
  applications: "アプリケーション"
  catalogue_complet: "完全なカタログ、予定しているアプリ、marketplace への貢献方法を見る。"
  adresse: "インターネット上のあなたのアドレス"
  adresse_texte: "公開アドレス <span class=\"mono\">cloud.<b>your-name</b>.pi-appliance.com</span> とインターネットからのアクセスは、まだ利用できません。"
  adresse_champ: "アドレスの名前"
  adresse_exemple: "your-name"
  reserver: "このアドレスを予約する"
  reserver_note: "アドレスの予約は、プロジェクトの後の段階で予定しています。"
  telecharger: "イメージをダウンロード"
  telecharger_valide: "イメージは Raspberry Pi 3 B+ と Raspberry Pi 4 で検証済みです。"
  telecharger_texte: "これはまだ保証のない実験版です。大切なファイルはコピーを取っておいてください。インストールのページで、ファイルの確認方法とイメージの書き込み方法を説明しています。インストール済みの Pi はコンソールから更新できます（「マイ Pi」、「アップデート」）。最新バージョンにイメージがない場合（基盤のみの更新）、そのページに最新イメージへのリンクがあります。"
  telecharger_bouton: "最新バージョンをダウンロード"
  telecharger_instructions: "インストール手順を読む"
