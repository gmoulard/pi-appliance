  lire_guide: "Lire le guide"
  parcours: "Le parcours visé"
  etapes:
    - titre: "Flashez"
      texte: "Copiez l’image pi-appliance sur une carte SD."
    - titre: "Branchez"
      texte: "Le Pi démarre. Sans réseau, il crée un Wi-Fi « pi-appliance » : choisissez celui de la maison depuis votre téléphone."
    - titre: "Choisissez"
      texte: "Installez vos applications depuis la console. L’accès depuis internet fait partie des prochaines étapes."
  parcours_note: "Ce parcours est validé sur Raspberry Pi 3 B+ et Raspberry Pi 4 ; le Pi 5 et le Pi Zero 2 W restent à essayer."
  parties: "Trois parties, un seul nom"
  trois:
    - titre: "L’image"
      texte: "Le système du Pi, prêt à l’emploi, à copier sur la carte SD."
    - titre: "Le socle et sa console"
      texte: "Toujours installé sur le Pi : une page web pour régler le Pi et installer vos services, et ses outils, dont la commande pia."
    - titre: "L’application mobile"
      texte: "Le guide lisible sans réseau, et un raccourci vers vos Pi sur le téléphone."
  applications: "Les applications"
  catalogue_complet: "Voir le catalogue complet, les applications prévues et comment contribuer à la marketplace."
  adresse: "Votre adresse sur internet"
