  h1: "Votre serveur, <span>à la maison.</span>"
  chapeau: "Une console en français pour installer et gérer vos services chez vous. L’image système est validée sur Raspberry Pi 3 B+ et Raspberry Pi 4."
  carte: "Objectif du projet : moins de 15 minutes entre la carte SD et un service prêt à l’emploi, à la maison et sur internet. Toutes vos données restent chez vous, en sécurité. Cette version est encore expérimentale."
