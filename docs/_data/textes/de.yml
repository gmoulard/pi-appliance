accueil:
  titre: "pi-appliance — Ihr Server, zu Hause"
  description: "pi-appliance macht aus einem Raspberry Pi einen persönlichen Server, zu Hause und im Internet: ein Image, eine Konsole, eine mobile App. Experimentelle Version."
  pastille: "Experimentelle Version für Raspberry Pi 5, 4, 3 B+ und Zero 2 W"
  h1: "Ihr Server, <span>zu Hause.</span>"
  chapeau: "Eine Konsole in Ihrer Sprache (12 Sprachen), um Ihre Dienste zu Hause zu installieren und zu verwalten. Das System-Image ist auf Raspberry Pi 3 B+ und Raspberry Pi 4 geprüft."
  carte: "Ziel des Projekts: weniger als 15 Minuten von der SD-Karte bis zu einem einsatzbereiten Dienst, zu Hause und im Internet. Alle Ihre Daten bleiben sicher bei Ihnen. Diese Version ist noch experimentell."
  voir_avancement: "Fortschritt ansehen"
  lire_guide: "Anleitung lesen"
  parcours: "Der geplante Ablauf"
  etapes:
    - titre: "Flashen"
      texte: "Kopieren Sie das pi-appliance-Image auf eine SD-Karte."
    - titre: "Anschließen"
      texte: "Der Pi startet. Ohne Netzwerk erstellt er ein WLAN „pi-appliance“: Wählen Sie mit Ihrem Telefon das WLAN Ihres Zuhauses."
    - titre: "Auswählen"
      texte: "Installieren Sie Ihre Anwendungen über die Konsole. Der Zugang aus dem Internet gehört zu den nächsten Schritten."
  parcours_note: "Dieser Ablauf ist auf Raspberry Pi 3 B+ und Raspberry Pi 4 geprüft; Pi 5 und Pi Zero 2 W müssen noch getestet werden."
  parties: "Drei Teile, ein Name"
  trois:
    - titre: "Das Image"
      texte: "Das System des Pi, einsatzbereit, zum Kopieren auf die SD-Karte."
    - titre: "Die Basis und ihre Konsole"
      texte: "Immer auf dem Pi installiert: eine Webseite, um den Pi einzurichten und Ihre Dienste zu installieren, und ihre Werkzeuge, darunter der Befehl pia."
    - titre: "Die mobile App"
      texte: "Die Anleitung, auch ohne Netzwerk lesbar, und eine Verknüpfung zu Ihren Pis auf dem Telefon."
  applications: "Die Anwendungen"
  catalogue_complet: "Den vollständigen Katalog, die geplanten Anwendungen und die Mitarbeit am Marketplace ansehen."
  adresse: "Ihre Adresse im Internet"
  adresse_texte: "Die öffentliche Adresse <span class=\"mono\">cloud.<b>ihr-name</b>.pi-appliance.com</span> und der Zugang aus dem Internet sind noch nicht verfügbar."
  adresse_champ: "Name Ihrer Adresse"
  adresse_exemple: "ihr-name"
  reserver: "Diese Adresse reservieren"
  reserver_note: "Das Reservieren von Adressen ist für eine spätere Projektphase geplant."
  telecharger: "Image herunterladen"
  telecharger_valide: "Das Image ist auf Raspberry Pi 3 B+ und Raspberry Pi 4 geprüft."
  telecharger_texte: "Es ist noch eine experimentelle Version, ohne Gewähr: Bewahren Sie eine Kopie Ihrer wichtigen Dateien auf. Die Installationsseite erklärt, wie Sie die Datei prüfen und das Image flashen. Ein bereits installierter Pi wird über die Konsole aktualisiert („Mein Pi“, „Aktualisierungen“). Hat die neueste Version kein Image (nur Aktualisierung der Basis), nennt ihre Seite den Link zum neuesten Image."
  telecharger_bouton: "Neueste Version herunterladen"
  telecharger_instructions: "Installationsanleitung lesen"
