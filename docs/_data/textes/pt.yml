accueil:
  titre: "pi-appliance — o seu servidor, em casa"
  description: "O pi-appliance transforma um Raspberry Pi num servidor pessoal, em casa e na internet: uma imagem, uma consola, uma aplicação móvel. Versão experimental."
  pastille: "Versão experimental para Raspberry Pi 5, 4, 3 B+ e Zero 2 W"
  h1: "O seu servidor, <span>em casa.</span>"
  chapeau: "Uma consola no seu idioma (12 idiomas) para instalar e gerir os seus serviços em casa. A imagem do sistema está validada no Raspberry Pi 3 B+ e no Raspberry Pi 4."
  carte: "Objetivo do projeto: menos de 15 minutos entre o cartão SD e um serviço pronto a usar, em casa e na internet. Todos os seus dados ficam consigo, em segurança. Esta versão ainda é experimental."
  voir_avancement: "Ver o progresso"
  lire_guide: "Ler o guia"
  parcours: "O percurso previsto"
  etapes:
    - titre: "Grave"
      texte: "Copie a imagem pi-appliance para um cartão SD."
    - titre: "Ligue"
      texte: "O Pi arranca. Sem rede, cria um Wi-Fi «pi-appliance»: escolha o de casa a partir do seu telemóvel."
    - titre: "Escolha"
      texte: "Instale as suas aplicações a partir da consola. O acesso a partir da internet faz parte dos próximos passos."
  parcours_note: "Este percurso está validado no Raspberry Pi 3 B+ e no Raspberry Pi 4; o Pi 5 e o Pi Zero 2 W ainda estão por testar."
  parties: "Três partes, um só nome"
  trois:
    - titre: "A imagem"
      texte: "O sistema do Pi, pronto a usar, para copiar para o cartão SD."
    - titre: "A base e a sua consola"
      texte: "Sempre instalada no Pi: uma página web para configurar o Pi e instalar os seus serviços, e as suas ferramentas, entre elas o comando pia."
    - titre: "A aplicação móvel"
      texte: "O guia, legível sem rede, e um atalho para os seus Pi no telemóvel."
  applications: "As aplicações"
  catalogue_complet: "Ver o catálogo completo, as aplicações previstas e como contribuir para a marketplace."
  adresse: "O seu endereço na internet"
  adresse_texte: "O endereço público <span class=\"mono\">cloud.<b>o-seu-nome</b>.pi-appliance.com</span> e o acesso a partir da internet ainda não estão disponíveis."
  adresse_champ: "Nome do seu endereço"
  adresse_exemple: "o-seu-nome"
  reserver: "Reservar este endereço"
  reserver_note: "A reserva de endereços está prevista para uma etapa posterior do projeto."
  telecharger: "Descarregar a imagem"
  telecharger_valide: "A imagem está validada no Raspberry Pi 3 B+ e no Raspberry Pi 4."
  telecharger_texte: "Ainda é uma versão experimental, sem garantia: guarde uma cópia dos seus ficheiros importantes. A página de instalação explica como verificar o ficheiro e gravar a imagem. Um Pi já instalado atualiza-se a partir da consola («O meu Pi», «Atualizações»). Se a última versão não tiver imagem (atualização só da base), a sua página dá a ligação para a última imagem."
  telecharger_bouton: "Descarregar a última versão"
  telecharger_instructions: "Ler as instruções de instalação"
