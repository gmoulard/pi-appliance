accueil:
  titre: "pi-appliance — uw server, thuis"
  description: "pi-appliance maakt van een Raspberry Pi een persoonlijke server, thuis en op internet: één image, één console, één mobiele app. Experimentele versie."
  pastille: "Experimentele versie voor Raspberry Pi 5, 4, 3 B+ en Zero 2 W"
  h1: "Uw server, <span>thuis.</span>"
  chapeau: "Een console in uw taal (12 talen) om uw diensten thuis te installeren en te beheren. De systeemimage is gevalideerd op Raspberry Pi 3 B+ en Raspberry Pi 4."
  carte: "Doel van het project: minder dan 15 minuten van de SD-kaart tot een dienst die klaar is voor gebruik, thuis en op internet. Al uw gegevens blijven veilig bij u. Deze versie is nog experimenteel."
  voir_avancement: "Voortgang bekijken"
  lire_guide: "Handleiding lezen"
  parcours: "Het beoogde verloop"
  etapes:
    - titre: "Flashen"
      texte: "Kopieer de pi-appliance-image naar een SD-kaart."
    - titre: "Aansluiten"
      texte: "De Pi start op. Zonder netwerk maakt hij een wifi „pi-appliance” aan: kies met uw telefoon de wifi van uw huis."
    - titre: "Kiezen"
      texte: "Installeer uw toepassingen vanuit de console. Toegang via internet hoort bij de volgende stappen."
  parcours_note: "Dit verloop is gevalideerd op Raspberry Pi 3 B+ en Raspberry Pi 4; de Pi 5 en de Pi Zero 2 W moeten nog worden getest."
  parties: "Drie delen, één naam"
  trois:
    - titre: "De image"
      texte: "Het systeem van de Pi, klaar voor gebruik, om naar de SD-kaart te kopiëren."
    - titre: "De basis en de console"
      texte: "Altijd geïnstalleerd op de Pi: een webpagina om de Pi in te stellen en uw diensten te installeren, en de hulpmiddelen, waaronder de opdracht pia."
    - titre: "De mobiele app"
      texte: "De handleiding, leesbaar zonder netwerk, en een snelkoppeling naar uw Pi's op de telefoon."
  applications: "De toepassingen"
  catalogue_complet: "Bekijk de volledige catalogus, de geplande toepassingen en hoe u kunt bijdragen aan de marketplace."
  adresse: "Uw adres op internet"
  adresse_texte: "Het openbare adres <span class=\"mono\">cloud.<b>uw-naam</b>.pi-appliance.com</span> en de toegang via internet zijn nog niet beschikbaar."
  adresse_champ: "Naam van uw adres"
  adresse_exemple: "uw-naam"
  reserver: "Dit adres reserveren"
  reserver_note: "Het reserveren van adressen is gepland voor een latere fase van het project."
  telecharger: "De image downloaden"
  telecharger_valide: "De image is gevalideerd op Raspberry Pi 3 B+ en Raspberry Pi 4."
  telecharger_texte: "Dit is nog een experimentele versie, zonder garantie: bewaar een kopie van uw belangrijke bestanden. De installatiepagina legt uit hoe u het bestand controleert en de image flasht. Een Pi die al geïnstalleerd is, wordt bijgewerkt vanuit de console („Mijn Pi”, „Updates”). Heeft de nieuwste versie geen image (alleen een update van de basis), dan geeft de pagina ervan de link naar de nieuwste image."
  telecharger_bouton: "De nieuwste versie downloaden"
  telecharger_instructions: "De installatie-instructies lezen"
